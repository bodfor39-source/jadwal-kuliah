<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>Jadwal Perkuliahan</h1>
        
        <div id="perm-banner" onclick="aktifkanFitur()" style="background:#005696; color:white; padding:12px; text-align:center; cursor:pointer; margin-bottom:15px; border-radius:4px; display:none; font-weight:bold;">
            Klik di sini untuk mengaktifkan Notifikasi & Alarm
        </div>

        <div id="statusNotif" class="status-bar">Status: Memantau jadwal...</div>
        
        <div class="filter-group" style="margin-bottom: 20px;">
            <button onclick="renderTable()">Semua</button>
            <button onclick="filterHari(1)">Senin</button>
            <button onclick="filterHari(3)">Rabu</button>
            <button onclick="filterHari(5)">Jumat</button>
            <button id="btnNotifStatus" style="background:#6c757d; cursor:default;">Notif: Off</button>
        </div>

        <div class="input-group">
            <input type="text" id="nama" placeholder="Nama Mata Kuliah">
            <input type="time" id="jam">
            <select id="hari">
                <option value="1">Senin</option><option value="2">Selasa</option>
                <option value="3">Rabu</option><option value="4">Kamis</option>
                <option value="5">Jumat</option>
                <option value="6">Sabtu</option>
            </select>
            <label style="display:block; font-size:12px;">Pengingat (menit):</label>
            <input type="number" id="waktuIngatkan" value="0" min="0" max="1440" placeholder="0">
            <button id="btnTambah" onclick="tambahManual()" class="btn-primary">Tambah Jadwal</button>
        </div>

        <div class="ocr-group" style="margin-top: 15px;">
            <input type="file" id="uploadGambar" accept="image/*, .xlsx, .xls">
            <button onclick="prosesFile()" class="btn-secondary">Impor Data (Gambar/Excel)</button>
        </div>

        <table id="jadwalTable">
            <thead>
                <tr>
                    <th>Mata Kuliah & Dosen</th>
                    <th>Hari</th>
                    <th>Jam</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="jadwalBody"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
